unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded"

set -g prefix C-s
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g monitor-bell on
set -g bell-action other
set -g default-terminal "tmux-256color"
set -g status-position top

# Vim nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Intuitive splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Window 10 (since prefix+0 reads as single digit)
bind 0 select-window -t :10

# Catppuccin (options must be set before TPM runs)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_text " #W#{?window_bell_flag, #[fg=#f38ba8]*,}"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_background "default"

# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-hook-post-save-all '~/.tmux/scripts/save-labels.sh'
set -g @resurrect-hook-post-restore-all '~/.tmux/scripts/restore-labels.sh'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'

# Status bar (must be after TPM loads Catppuccin)
set -g status-left ""
set -g status-right-length 100
# Prepend continuum's save hook: this override would otherwise discard the hook
# TPM injects into status-right, silently disabling auto-save. Script is invisible.
set -g status-interval 5
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{E:@catppuccin_status_session}"

# Pane labels — uses custom @label option so Claude Code can't overwrite
set -g pane-border-status bottom
set -g pane-border-format "#{?@label,#[bold]#[#{?pane_active,bg=#879a39 fg=#100f0f,bg=#403e3c fg=#cecdc3}] #{@label} #[default],}"
set -g pane-border-style "fg=#575653"
set -g pane-active-border-style "fg=#d0a215"
bind T command-prompt -p "Label:" "set -p @label '%%'"

# The Claude cockpit: the list of conversations on the left, the one you picked on
# the right. tmux hosts each conversation in its own session, which it never shows,
# so the list survives anything that happens to this one.
bind a run-shell "~/.tmux/scripts/cc-cockpit.sh --ensure" \; switch-client -t cockpit

# Flat across every pane so tmux never lightens Ghostty's Flexoki ground.
# The active pane is marked by its border colour instead of a background tint,
# which otherwise reads as the terminal background being wrong.
set -g window-style "bg=#100f0f"
set -g window-active-style "bg=#100f0f"
